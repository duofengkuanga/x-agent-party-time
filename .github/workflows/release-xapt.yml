name: Release xapt

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run format:check
      - run: sh scripts/release-xapt.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/xapt-darwin-arm64.tar.gz
            dist/release/xapt-darwin-arm64.tar.gz.sha256
