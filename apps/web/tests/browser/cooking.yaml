      - visible: 'article[data-stage="WAITING_FOR_REPAIR"] button[aria-label^="待前后端分诊缺陷，前端"]'
      - visible: 'article[data-stage="WAITING_FOR_REPAIR"] button[aria-label^="待前后端分诊缺陷，后端"]'

