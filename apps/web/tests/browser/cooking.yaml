  - name: sticky round tabs cover the full scroll edge in batch details
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: '.collab-update-batch-card'
      - click: '.collab-update-batch-card .collab-bug-card__open'
      - wait: '[aria-label="批次内缺陷"]'
      - eval: >-
          window.stickyGeometry=[];
          (()=>{const body=document.querySelector('.collab-developer-detail'),tabs=document.querySelector('.collab-execution-round-tabs__list'),shell=document.querySelector('.collab-shell'),theme=shell.dataset.theme;
          body.scrollTo({top:0,behavior:'instant'}); const origin=tabs.getBoundingClientRect().top-body.getBoundingClientRect().top;
          body.scrollTo({top:origin+40,behavior:'instant'});
          for(const mode of ['paper','night']){shell.dataset.theme=mode;const b=body.getBoundingClientRect(),t=tabs.getBoundingClientRect();
          window.stickyGeometry.push({theme:mode,gap:t.top-b.top,covered:tabs.contains(document.elementFromPoint(t.left+t.width/2,b.top+5)),background:getComputedStyle(tabs).backgroundColor});}
          shell.dataset.theme=theme;body.scrollTo({top:0,behavior:'instant'});return window.stickyGeometry;})()
    assert:
      - eval: 'window.stickyGeometry.every(result=>Math.abs(result.gap)<=1 && result.covered && result.background!=="rgba(0, 0, 0, 0)")'

