suite: Cooking architecture browser acceptance
setup:
  - open: __BASE_URL__/login?next=/cooking/__SUBMISSION_ID__
  - fill: { sel: 'input[name="username"]', text: __USERNAME__ }
  - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
  - click: '.auth-submit'
  - wait: { load: networkidle }
cases:
  - name: unassigned deletion asks for confirmation and cancel restores focus
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: 'button[aria-label^="测试负责人删除缺陷，"]'
      - click: 'button[aria-label^="测试负责人删除缺陷，"]'
      - wait: '[aria-label="删除待分配缺陷"] button'
      - eval: >-
          (() => { const shell=document.querySelector('.collab-shell'), button=document.querySelector('[aria-label="删除待分配缺陷"] button');
          window.deleteDefaultStyles=['paper','night'].every(theme=>{shell.dataset.theme=theme;return getComputedStyle(button).backgroundColor==='rgba(0, 0, 0, 0)';});
          shell.dataset.theme='paper';return true;})()
      - click: '[aria-label="删除待分配缺陷"] button'
      - wait: '[aria-label="确认删除缺陷"]'
    assert:
      - text: { sel: '[aria-label="删除待分配缺陷"]', contains: 删除后无法恢复 }
      - eval: 'document.activeElement.textContent.trim() === "取消"'
      - eval: 'window.deleteDefaultStyles'
      - visible: 'button[aria-label^="测试负责人删除缺陷，"]'

  - name: cancel leaves the unassigned bug intact and the delete trigger focused
    steps:
      - click: '[aria-label="确认删除缺陷"] button:first-child'
    assert:
      - hidden: '[aria-label="确认删除缺陷"]'
      - eval: 'document.activeElement.textContent.trim() === "删除缺陷"'
      - visible: 'button[aria-label^="测试负责人删除缺陷，"]'

  - name: deletion has reachable confirmation in both themes and disables pending actions
    steps:
      - click: '[aria-label="删除待分配缺陷"] button'
      - eval: >-
          (() => { const shell=document.querySelector('.collab-shell');
          window.deleteFits=['paper','night'].every(theme=>{ shell.dataset.theme=theme;
          const group=document.querySelector('[aria-label="确认删除缺陷"]');
          const box=group.getBoundingClientRect(); return box.top>=0 && box.bottom<=innerHeight && box.right<=innerWidth; });
          shell.dataset.theme='paper'; window.deleteOriginalFetch=window.fetch;
          window.fetch=(...args)=>new Headers(args[1]?.headers).has('Next-Action')
          ? new Promise((resolve,reject)=>{window.rejectDelete=reject;}) : window.deleteOriginalFetch(...args); return true; })()
      - click: '[aria-label="确认删除缺陷"] button:last-child'
      - wait: '[aria-label="确认删除缺陷"] button:disabled'
    assert:
      - eval: 'window.deleteFits'
      - eval: '[...document.querySelectorAll("[aria-label=确认删除缺陷] button")].every(button=>button.disabled)'
      - text: { sel: '[aria-label="删除待分配缺陷"]', contains: 正在删除 }

  - name: deletion failure stays visible and permits retry
    steps:
      - eval: 'window.fetch=window.deleteOriginalFetch; window.rejectDelete(new TypeError("Failed to fetch")); true'
      - wait: '[aria-label="删除待分配缺陷"] [role="alert"]'
    assert:
      - visible: 'button[aria-label^="测试负责人删除缺陷，"]'
      - eval: '[...document.querySelectorAll("[aria-label=确认删除缺陷] button")].every(button=>!button.disabled)'

  - name: tester confirms deletion and refresh removes the card and drawer
    steps:
      - click: '[aria-label="确认删除缺陷"] button:last-child'
      - wait: 1200
    assert:
      - hidden: 'button[aria-label^="测试负责人删除缺陷，"]'
      - hidden: '.collab-bug-drawer'
      - text: { sel: '[role="status"]', contains: 已删除 }

  - name: submission item developer can delete unassigned bugs from developer details
    steps:
      - eval: "[...document.querySelectorAll('button')].find(button=>button.textContent?.includes('退出登录'))?.click(); true"
      - wait: 'input[name="username"]'
      - fill: { sel: 'input[name="username"]', text: __DEVELOPER_USERNAME__ }
      - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
      - click: '.auth-submit'
      - wait: { load: networkidle }
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: 'button[aria-label^="开发负责人删除缺陷，"]'
      - click: 'button[aria-label^="开发负责人删除缺陷，"]'
      - wait: '.collab-bug-drawer--developer'
      - click: '[aria-label="删除待分配缺陷"] button'
      - click: '[aria-label="确认删除缺陷"] button:last-child'
      - wait: 1200
    assert:
      - hidden: 'button[aria-label^="开发负责人删除缺陷，"]'
      - hidden: '.collab-bug-drawer'

  - name: assigned bugs do not offer deletion and tester session is restored
    steps:
      - click: 'button[aria-label^="待取消缺陷，"]'
      - wait: '.collab-bug-drawer--developer'
    assert:
      - hidden: '[aria-label="删除待分配缺陷"]'

  - name: return to tester for remaining acceptance cases
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - eval: "[...document.querySelectorAll('button')].find(button=>button.textContent?.includes('退出登录'))?.click(); true"
      - wait: 'input[name="username"]'
      - fill: { sel: 'input[name="username"]', text: __USERNAME__ }
      - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
      - click: '.auth-submit'
      - wait: { load: networkidle }

  - name: tester details show a compact report without technical chrome
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: 'button[aria-label^="待取消缺陷，"]'
      - click: 'button[aria-label^="待取消缺陷，"]'
      - wait: '.collab-bug-drawer--tester'
    assert:
      - text: { sel: '.collab-bug-drawer__heading h2', equals: 待取消缺陷 }
      - text: { sel: '.collab-tester-detail__meta', contains: 缺陷- }
      - text:
          { sel: '.collab-tester-detail__status', contains: 确认后可以开始修复 }
      - hidden: '.collab-bug-identity'
      - hidden: '.collab-bug-detail-tabs'
      - hidden: '.collab-repair-timeline'
      - text: { sel: '.collab-tester-detail__comparison', contains: 预期结果 }
      - text:
          { sel: '.collab-tester-detail__comparison', contains: 原始实际结果 }
      - eval: '(() => { const [expected,actual]=document.querySelectorAll(".collab-tester-detail__comparison > div"); return expected.getBoundingClientRect().right <= actual.getBoundingClientRect().left; })()'
      - eval: 'getComputedStyle(document.querySelector(".collab-tester-detail")).overflowY === "auto"'
      - eval: '[...document.querySelectorAll(".collab-tester-detail__actions button")].map(b=>b.textContent.trim()).join("|") === "编辑资料|开始修复"'

  - name: tester waiting states explain ownership without exposing technical reports
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - click: 'button[aria-label^="等待人工确认缺陷，"]'
      - wait: '.collab-bug-drawer--tester'
    assert:
      - text:
          {
            sel: '.collab-tester-detail__status',
            contains: 等待浏览器测试开发者处理,
          }
      - hidden: '.collab-tester-detail__actions'
      - hidden: '.collab-session-overview'
      - eval: '!document.querySelector(".collab-bug-drawer").textContent.match(/Codex|Session|会话|候选提交|释放|bun test/)'

  - name: completed tester details keep the report and offer reopening without process tabs
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - click: 'button[aria-label^="修复更新页签滚动回归，"]'
      - wait: '.collab-bug-drawer--tester'
    assert:
      - text: { sel: '.collab-tester-detail__status', contains: 已验收通过 }
      - text: { sel: '.collab-tester-detail__actions', contains: 重新打开 }
      - hidden: '.collab-tester-detail__feedback'
      - hidden: '.collab-bug-detail-tabs'
      - eval: 'document.querySelector(".collab-bug-drawer").getBoundingClientRect().height < 738'

  - name: bug registration accepts a 4.1 MB screenshot
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - fill:
          {
            sel: '#collab-bug-form input[maxlength="240"]',
            text: 大截图登记回归,
          }
      - eval: >-
          (() => { const input = document.querySelector('[aria-label="预期结果附件"] input[type="file"]');
          const canvas = document.createElement('canvas'); canvas.width = canvas.height = 1;
          const bytes = new Uint8Array(Math.ceil(4.1 * 1024 * 1024));
          bytes.set(Uint8Array.from(atob(canvas.toDataURL().split(',')[1]), (c) => c.charCodeAt(0)));
          const transfer = new DataTransfer(); transfer.items.add(new File([bytes], 'large-screenshot.png', { type: 'image/png' }));
          Object.defineProperty(input, 'files', { configurable: true, value: transfer.files });
          input.dispatchEvent(new Event('change', { bubbles: true })); return true; })()
      - click: 'button[form="collab-bug-form"]:not([value="repair"])'
      - wait: 1500
    assert:
      - hidden: '#collab-bug-form'
      - visible: 'article[data-stage="WAITING_FOR_REPAIR"] button[aria-label^="大截图登记回归，"]'

  - name: interrupted registration explains uncertainty and preserves the draft for retry
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - fill:
          {
            sel: '#collab-bug-form input[maxlength="240"]',
            text: 网络中断保留草稿,
          }
      - eval: >-
          (() => { const original = window.fetch;
          window.fetch = (...args) => {
          if (new Headers(args[1]?.headers).has('Next-Action')) {
          window.fetch = original; return Promise.reject(new TypeError('Failed to fetch')); }
          return original(...args); }; return true; })()
      - click: 'button[form="collab-bug-form"]:not([value="repair"])'
      - wait: '[role="alert"]'
    assert:
      - text: { sel: '[role="alert"]', contains: 未收到服务器响应 }
      - text: { sel: '[role="alert"]', contains: 先核对当前记录 }
      - eval: 'document.querySelector(''#collab-bug-form input[maxlength="240"]'').value === ''网络中断保留草稿'''
      - eval: '!document.querySelector(''button[form="collab-bug-form"]:not([value="repair"])'').disabled'

  - name: retry succeeds after the connection recovers
    steps:
      - click: 'button[form="collab-bug-form"]:not([value="repair"])'
      - wait: 1500
    assert:
      - hidden: '#collab-bug-form'
      - count: { sel: 'button[aria-label^="网络中断保留草稿，"]', eq: 1 }

  - name: tester can save an existing report as two linked engineering defects
    steps:
      - click: 'button[aria-label^="网络中断保留草稿，"]'
      - click: '.collab-tester-detail__actions button:first-child'
      - wait: '#collab-bug-form'
      - click: '.collab-joint-choice input'
      - click: 'button[form="collab-bug-form"]:not([value="repair"])'
      - wait: 1500
    assert:
      - hidden: '#collab-bug-form'
      - count: { sel: 'button[aria-label^="网络中断保留草稿，"]', eq: 2 }

  - name: oversized attachment explains which file to replace in night theme
    steps:
      - click: 'button[aria-label="切换暗夜主题"]'
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - eval: >-
          (() => { const input = document.querySelector('[aria-label="实际结果附件"] input[type="file"]');
          const transfer = new DataTransfer(); transfer.items.add(new File([new Uint8Array(11 * 1024 * 1024)], 'too-large.png', { type: 'image/png' }));
          Object.defineProperty(input, 'files', { configurable: true, value: transfer.files });
          input.dispatchEvent(new Event('change', { bubbles: true })); return true; })()
    assert:
      - text:
          {
            sel: '[aria-label="实际结果附件"]',
            contains: '「too-large.png」（11.0 MB）超过单个附件 10 MB',
          }
      - count:
          { sel: '[aria-label="实际结果附件"] .collab-attachment-tile', eq: 0 }
      - visible: 'button[form="collab-bug-form"]:not([value="repair"])'

  - name: both report groups accept five attachments at the 10 MB boundary
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - click: 'button[aria-label="切换纸张主题"]'
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - fill:
          {
            sel: '#collab-bug-form input[maxlength="240"]',
            text: 双组附件上限登记,
          }
      - eval: >-
          (() => { for (const label of ['实际结果附件', '预期结果附件']) {
          const input = document.querySelector(`[aria-label="${label}"] input[type="file"]`);
          const transfer = new DataTransfer(); for (let i = 0; i < 5; i++)
          transfer.items.add(new File([new Uint8Array(10 * 1024 * 1024)], `${label}-${i}.txt`, { type: 'text/plain' }));
          Object.defineProperty(input, 'files', { configurable: true, value: transfer.files });
          input.dispatchEvent(new Event('change', { bubbles: true })); } return true; })()
      - click: 'button[form="collab-bug-form"]:not([value="repair"])'
      - wait: 'button[aria-label^="双组附件上限登记，"]'
      - click: 'button[aria-label^="双组附件上限登记，"]'
      - wait: '[role="dialog"]'
    assert:
      - count:
          { sel: '[role="dialog"] .collab-bug-detail-attachments li', eq: 10 }

  - name: joint registration creates two independent linked bugs with shared evidence
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - click: '#collab-bug-form input[type="checkbox"]'
      - fill:
          {
            sel: '#collab-bug-form input[maxlength="240"]',
            text: 浏览器前后端关联单,
          }
      - eval: >-
          (() => { const input = document.querySelector('[aria-label="实际结果附件"] input[type="file"]');
          const transfer = new DataTransfer(); transfer.items.add(new File(['joint proof'], 'joint-proof.txt', { type: 'text/plain' }));
          Object.defineProperty(input, 'files', { configurable: true, value: transfer.files });
          input.dispatchEvent(new Event('change', { bubbles: true })); return true; })()
      - click: 'button[form="collab-bug-form"]:not([value="repair"])'
      - wait: 1000
      - click: 'button[aria-label^="浏览器前后端关联单，前端，"]'
      - wait: '[role="dialog"]'
    assert:
      - count:
          {
            sel: 'article[data-stage="WAITING_FOR_REPAIR"] button[aria-label^="浏览器前后端关联单，"]',
            eq: 2,
          }
      - text: { sel: '[role="dialog"]', contains: joint-proof.txt }
      - text: { sel: '[aria-label="关联缺陷"]', contains: 浏览器后端工程 }
      - hidden: '[aria-label="人工工程流转"]'

  - name: linked bug opens the other engineering without losing shared evidence
    steps:
      - click: '[aria-label="关联缺陷"] button'
      - wait: 350
    assert:
      - text: { sel: '[role="dialog"]', contains: 后端 · 浏览器后端工程 }
      - text: { sel: '[role="dialog"]', contains: joint-proof.txt }
      - text: { sel: '[aria-label="关联缺陷"]', contains: 浏览器前端工程 }
      - hidden: '[aria-label="人工工程流转"]'

  - name: tester failure describes the next owner without exposing the raw repair report
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - click: 'button[aria-label^="定位数据缺失缺陷，"]'
      - wait: '[role="dialog"]'
    assert:
      - text: { sel: '.collab-tester-detail__status', contains: 修复遇到问题 }
      - text:
          {
            sel: '.collab-tester-detail__status',
            contains: 等待浏览器测试开发者处理,
          }
      - hidden: '.collab-repair-timeline'
      - hidden: '[aria-label="人工工程流转"]'
      - eval: '!document.querySelector(".collab-bug-drawer").textContent.includes("确认三条地块的边界为空")'

  - name: responsible developer still sees manual routing
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('退出登录'))?.click(); true"
      - wait: 'input[name="username"]'
      - fill: { sel: 'input[name="username"]', text: __DEVELOPER_USERNAME__ }
      - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
      - click: '.auth-submit'
      - wait: { load: networkidle }
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: 'button[aria-label^="定位数据缺失缺陷，"]'
      - click: 'button[aria-label^="定位数据缺失缺陷，"]'
      - wait: '[aria-label="人工工程流转"]'
    assert:
      - visible: '[aria-label="人工工程流转"]'
      - text: { sel: '[aria-label="人工工程流转"]', contains: 转交后端 }
      - text: { sel: '[aria-label="人工工程流转"]', contains: 增加后端协作 }
      - eval: 'parseFloat(getComputedStyle(document.querySelector(".collab-routing-actions")).columnGap) >= 8'

  - name: developer timeline keeps four fixed fields and all identifiers
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - click: 'button[aria-label^="修复更新页签滚动回归，"]'
      - wait: '.collab-bug-drawer--developer'
      - eval: 'window.developerModalTop=document.querySelector(".collab-bug-drawer").getBoundingClientRect().top; true'
    assert:
      - visible: '.collab-execution-identities [aria-label="缺陷 ID"]'
      - visible: '.collab-execution-identities [aria-label="修复会话 ID"]'
      - visible: '.collab-execution-identities [aria-label="更新会话 ID"]'
      - count: { sel: '.collab-execution-round', eq: 3 }
      - count: { sel: '[role="tab"]', eq: 3 }
      - text: { sel: '[role="tab"][aria-selected="true"]', equals: 第 1 轮更新 }
      - count: { sel: '[role="tabpanel"]:not([hidden])', eq: 1 }
      - hidden: '.collab-execution-round details'
      - eval: '[...document.querySelectorAll(".collab-execution-round__fields dt")].every(dt=>parseFloat(getComputedStyle(dt).fontSize)>=14 && Number(getComputedStyle(dt).fontWeight)>=700)'
      - eval: '[...document.querySelectorAll(".collab-execution-round__fields")].every(dl=>[...dl.querySelectorAll(":scope > div > dt")].map(dt=>dt.textContent).join("|")==="执行进展|代码变更|检查结果|交付状态")'
      - hidden: '.collab-developer-source[open]'
      - hidden: '.collab-bug-detail-tabs'
      - hidden: '.collab-tester-detail'
      - text:
          {
            sel: '[role="tabpanel"]:not([hidden])',
            contains: 历史上下文不代表本轮检查通过,
          }
      - text:
          {
            sel: '[role="tabpanel"]:not([hidden])',
            contains: 沿用修复阶段已确认的测试入口,
          }
      - text:
          {
            sel: '[role="tabpanel"]:not([hidden])',
            contains: 一次入口覆盖测试与构建,
          }
      - text:
          {
            sel: '[role="tabpanel"]:not([hidden])',
            contains: 'bun run check:delivery',
          }

  - name: defect and session identifiers copy exact values and report clipboard errors
    steps:
      - eval: >-
          window.originalClipboard=navigator.clipboard;
          Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async value=>{window.copiedIdentifier=value;}}}); true
      - click: 'button[aria-label="复制缺陷 ID"]'
      - eval: 'window.defectCopyMatches=window.copiedIdentifier===document.querySelector("[aria-label=\"缺陷 ID\"] code").textContent; true'
      - click: 'button[aria-label="复制修复会话 ID"]'
      - eval: 'window.repairCopyMatches=window.copiedIdentifier===document.querySelector("[aria-label=\"修复会话 ID\"] code").textContent; true'
      - click: 'button[aria-label="复制更新会话 ID"]'
      - eval: >-
          window.updateCopyMatches=window.copiedIdentifier===document.querySelector('[aria-label="更新会话 ID"] code').textContent;
          Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async ()=>{throw new Error('denied');}}}); true
      - click: 'button[aria-label="复制更新会话 ID"]'
      - wait: '[aria-label="更新会话 ID"] [role="alert"]'
      - eval: 'Object.defineProperty(navigator,"clipboard",{configurable:true,value:window.originalClipboard}); true'
    assert:
      - eval: 'window.defectCopyMatches && window.repairCopyMatches && window.updateCopyMatches'
      - text:
          {
            sel: '[aria-label="更新会话 ID"] [role="alert"]',
            contains: 复制失败,
          }
      - text: { sel: 'button[aria-label="复制更新会话 ID"]', equals: 复制 }

  - name: round tabs support keyboard navigation and keep the selected history during refresh
    steps:
      - eval: 'document.querySelector("[role=tab][aria-selected=true]").focus(); true'
      - press: ArrowRight
      - wait: 1500
    assert:
      - text: { sel: '[role="tab"][aria-selected="true"]', equals: 第 2 轮修复 }
      - eval: 'document.activeElement.getAttribute("role")==="tab" && document.activeElement.getAttribute("aria-selected")==="true"'
      - text: { sel: '[role="tabpanel"]:not([hidden])', contains: 定向测试 }
      - eval: 'document.querySelector("[role=tabpanel]:not([hidden])").textContent.includes("a".repeat(40))'
      - hidden: '[role="tabpanel"]:not([hidden]) details'
      - eval: 'Math.abs(document.querySelector(".collab-bug-drawer").getBoundingClientRect().top-window.developerModalTop)<=1'

  - name: switching to an older repair directly reveals its full result and preserves source access
    steps:
      - press: End
      - click: '.collab-developer-source > summary'
    assert:
      - text: { sel: '[role="tab"][aria-selected="true"]', equals: 第 1 轮修复 }
      - text:
          { sel: '[role="tabpanel"]:not([hidden])', contains: 完整检查尚未通过 }
      - text:
          {
            sel: '.collab-developer-source[open]',
