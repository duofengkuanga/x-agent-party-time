suite: Cooking architecture browser acceptance
setup:
  - open: __BASE_URL__/login?next=/cooking/__SUBMISSION_ID__
  - fill: { sel: 'input[name="username"]', text: __USERNAME__ }
  - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
  - click: '.auth-submit'
  - wait: { load: networkidle }
cases:
  - name: bug details keep title and id above two independently scrolling columns
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: 'button[aria-label^="待取消缺陷，"]'
      - click: 'button[aria-label^="待取消缺陷，"]'
      - wait: '.collab-bug-drawer--split'
    assert:
      - text: { sel: '.collab-bug-drawer__heading h2', equals: 待取消缺陷 }
      - visible: '.collab-bug-drawer__heading .collab-bug-identity code'
      - hidden: '.collab-bug-drawer__heading dl'
      - text: { sel: '.collab-bug-detail-context', contains: 预期结果 }
      - text: { sel: '.collab-bug-detail-context', contains: 实际结果 }
      - eval: 'document.querySelector(".collab-bug-detail-context").getBoundingClientRect().right <= document.querySelector(".collab-bug-detail-activity").getBoundingClientRect().left + 1'
      - eval: '[".collab-bug-detail-context", ".collab-bug-detail-activity"].every((selector) => getComputedStyle(document.querySelector(selector)).overflowY === "auto")'

  - name: switching process tabs preserves the defect fields on the left
    steps:
      - eval: 'window.bugModalPosition = {top:document.querySelector(".collab-bug-drawer").getBoundingClientRect().top, backdrop:document.querySelector(".collab-dialog-backdrop").scrollTop, page:window.scrollY, context:document.querySelector(".collab-bug-detail-context").scrollTop}; true'
      - click: '.collab-bug-detail-tabs button:last-child'
      - wait: 500
    assert:
      - visible: '.collab-bug-detail-activity > [data-progress-kind="update"]'
      - hidden: '.collab-bug-detail-activity > [data-progress-kind="repair"]'
      - visible: '.collab-bug-detail-context'
      - text:
          { sel: '.collab-bug-detail-context', contains: 待取消缺陷 的预期结果 }
      - eval: 'Math.abs(document.querySelector(".collab-bug-drawer").getBoundingClientRect().top - window.bugModalPosition.top) <= 1'

  - name: repair process and report editing remain reachable
    steps:
      - click: '.collab-bug-detail-tabs button:first-child'
      - wait: 500
    assert:
      - visible: '.collab-bug-detail-activity > [data-progress-kind="repair"]'
      - visible: '.collab-bug-detail-context__actions button'
      - eval: 'Math.abs(document.querySelector(".collab-bug-drawer").getBoundingClientRect().top - window.bugModalPosition.top) <= 1'
      - eval: 'document.querySelector(".collab-dialog-backdrop").scrollTop === window.bugModalPosition.backdrop && window.scrollY === window.bugModalPosition.page && document.querySelector(".collab-bug-detail-context").scrollTop === window.bugModalPosition.context'

  - name: returning to completed repair progress keeps the modal fixed
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - click: 'button[aria-label^="修复更新页签滚动回归，"]'
      - wait: '.collab-bug-drawer--split'
      - eval: 'window.bugModalTop = document.querySelector(".collab-bug-drawer").getBoundingClientRect().top; true'
      - click: '.collab-bug-detail-tabs button:last-child'
      - wait: 500
      - click: '.collab-bug-detail-tabs button:first-child'
      - wait: 500
    assert:
      - eval: 'Math.abs(document.querySelector(".collab-bug-drawer").getBoundingClientRect().top - window.bugModalTop) <= 1'
      - eval: 'document.querySelector(".collab-dialog-backdrop").scrollTop === 0'

  - name: bug registration accepts a 4.1 MB screenshot
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - fill:
          {
            sel: '#collab-bug-form input[maxlength="240"]',
            text: 大截图登记回归,
          }
      - eval: >-
          (() => { const input = document.querySelector('[aria-label="预期结果附件"] input[type="file"]');
          const canvas = document.createElement('canvas'); canvas.width = canvas.height = 1;
          const bytes = new Uint8Array(Math.ceil(4.1 * 1024 * 1024));
          bytes.set(Uint8Array.from(atob(canvas.toDataURL().split(',')[1]), (c) => c.charCodeAt(0)));
          const transfer = new DataTransfer(); transfer.items.add(new File([bytes], 'large-screenshot.png', { type: 'image/png' }));
          Object.defineProperty(input, 'files', { configurable: true, value: transfer.files });
          input.dispatchEvent(new Event('change', { bubbles: true })); return true; })()
      - click: 'button[form="collab-bug-form"]'
      - wait: 1500
    assert:
      - hidden: '#collab-bug-form'
      - visible: 'article[data-stage="WAITING_FOR_REPAIR"] button[aria-label^="大截图登记回归，"]'

  - name: interrupted registration explains uncertainty and preserves the draft for retry
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - fill:
          {
            sel: '#collab-bug-form input[maxlength="240"]',
            text: 网络中断保留草稿,
          }
      - eval: >-
          (() => { const original = window.fetch;
          window.fetch = (...args) => {
          if (new Headers(args[1]?.headers).has('Next-Action')) {
          window.fetch = original; return Promise.reject(new TypeError('Failed to fetch')); }
          return original(...args); }; return true; })()
      - click: 'button[form="collab-bug-form"]'
      - wait: '[role="alert"]'
    assert:
      - text: { sel: '[role="alert"]', contains: 未收到服务器响应 }
      - text: { sel: '[role="alert"]', contains: 先核对当前记录 }
      - eval: 'document.querySelector(''#collab-bug-form input[maxlength="240"]'').value === ''网络中断保留草稿'''
      - eval: '!document.querySelector(''button[form="collab-bug-form"]'').disabled'

  - name: retry succeeds after the connection recovers
    steps:
      - click: 'button[form="collab-bug-form"]'
      - wait: 1500
    assert:
      - hidden: '#collab-bug-form'
      - count: { sel: 'button[aria-label^="网络中断保留草稿，"]', eq: 1 }

  - name: tester can save an existing report as two linked engineering defects
    steps:
      - click: 'button[aria-label^="网络中断保留草稿，"]'
      - click: '.collab-bug-detail-context__actions button'
      - wait: '#collab-bug-form'
      - click: '.collab-joint-choice input'
      - click: 'button[form="collab-bug-form"]'
      - wait: 1500
    assert:
      - hidden: '#collab-bug-form'
      - count: { sel: 'button[aria-label^="网络中断保留草稿，"]', eq: 2 }

  - name: oversized attachment explains which file to replace in night theme
    steps:
      - click: 'button[aria-label="切换暗夜主题"]'
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - eval: >-
          (() => { const input = document.querySelector('[aria-label="实际结果附件"] input[type="file"]');
          const transfer = new DataTransfer(); transfer.items.add(new File([new Uint8Array(11 * 1024 * 1024)], 'too-large.png', { type: 'image/png' }));
          Object.defineProperty(input, 'files', { configurable: true, value: transfer.files });
          input.dispatchEvent(new Event('change', { bubbles: true })); return true; })()
    assert:
      - text:
          {
            sel: '[aria-label="实际结果附件"]',
            contains: '「too-large.png」（11.0 MB）超过单个附件 10 MB',
          }
      - count:
          { sel: '[aria-label="实际结果附件"] .collab-attachment-tile', eq: 0 }
      - visible: 'button[form="collab-bug-form"]'

  - name: both report groups accept five attachments at the 10 MB boundary
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - click: 'button[aria-label="切换纸张主题"]'
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - fill:
          {
            sel: '#collab-bug-form input[maxlength="240"]',
            text: 双组附件上限登记,
          }
      - eval: >-
          (() => { for (const label of ['实际结果附件', '预期结果附件']) {
          const input = document.querySelector(`[aria-label="${label}"] input[type="file"]`);
          const transfer = new DataTransfer(); for (let i = 0; i < 5; i++)
          transfer.items.add(new File([new Uint8Array(10 * 1024 * 1024)], `${label}-${i}.txt`, { type: 'text/plain' }));
          Object.defineProperty(input, 'files', { configurable: true, value: transfer.files });
          input.dispatchEvent(new Event('change', { bubbles: true })); } return true; })()
      - click: 'button[form="collab-bug-form"]'
      - wait: 'button[aria-label^="双组附件上限登记，"]'
      - click: 'button[aria-label^="双组附件上限登记，"]'
      - wait: '[role="dialog"]'
    assert:
      - count:
          { sel: '[role="dialog"] .collab-bug-detail-attachments li', eq: 10 }

  - name: joint registration creates two independent linked bugs with shared evidence
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - click: '#collab-bug-form input[type="checkbox"]'
      - fill:
          {
            sel: '#collab-bug-form input[maxlength="240"]',
            text: 浏览器前后端关联单,
          }
      - eval: >-
          (() => { const input = document.querySelector('[aria-label="实际结果附件"] input[type="file"]');
          const transfer = new DataTransfer(); transfer.items.add(new File(['joint proof'], 'joint-proof.txt', { type: 'text/plain' }));
          Object.defineProperty(input, 'files', { configurable: true, value: transfer.files });
          input.dispatchEvent(new Event('change', { bubbles: true })); return true; })()
      - click: 'button[form="collab-bug-form"]'
      - wait: 1000
      - click: 'button[aria-label^="浏览器前后端关联单，前端，"]'
      - wait: '[role="dialog"]'
    assert:
      - count:
          {
            sel: 'article[data-stage="WAITING_FOR_REPAIR"] button[aria-label^="浏览器前后端关联单，"]',
            eq: 2,
          }
      - text: { sel: '[role="dialog"]', contains: joint-proof.txt }
      - text: { sel: '[aria-label="关联缺陷"]', contains: 浏览器后端工程 }
      - hidden: '[aria-label="人工工程流转"]'

  - name: linked bug opens the other engineering without losing shared evidence
    steps:
      - click: '[aria-label="关联缺陷"] button'
      - wait: 350
    assert:
      - text: { sel: '[role="dialog"]', contains: 后端 · 浏览器后端工程 }
      - text: { sel: '[role="dialog"]', contains: joint-proof.txt }
      - text: { sel: '[aria-label="关联缺陷"]', contains: 浏览器前端工程 }
      - hidden: '[aria-label="人工工程流转"]'

  - name: tester reads the actual unfinished repair result
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - click: 'button[aria-label^="定位数据缺失缺陷，"]'
      - wait: '[role="dialog"]'
    assert:
      - text:
          { sel: '[role="dialog"]', contains: 地块缺少定位数据，问题尚未解决。 }
      - text: { sel: '[role="dialog"]', contains: 确认三条地块的边界为空 }
      - text: { sel: '[role="dialog"]', contains: 核查边界数据并验证标签渲染 }
      - hidden: '[role="dialog"] .collab-session-overview code'
      - hidden: '[aria-label="人工工程流转"]'
      - hidden: '.collab-repair-timeline .collab-session-overview'

  - name: responsible developer still sees manual routing
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('退出登录'))?.click(); true"
      - wait: 'input[name="username"]'
      - fill: { sel: 'input[name="username"]', text: __DEVELOPER_USERNAME__ }
      - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
      - click: '.auth-submit'
      - wait: { load: networkidle }
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: 'button[aria-label^="定位数据缺失缺陷，"]'
      - click: 'button[aria-label^="定位数据缺失缺陷，"]'
      - wait: '[aria-label="人工工程流转"]'
    assert:
      - visible: '[aria-label="人工工程流转"]'
      - text: { sel: '[aria-label="人工工程流转"]', contains: 转交后端 }
      - text: { sel: '[aria-label="人工工程流转"]', contains: 增加后端协作 }
      - eval: 'parseFloat(getComputedStyle(document.querySelector(".collab-routing-actions")).columnGap) >= 8'

  - name: manual transfer closes the source and queues a related backend bug
    steps:
      - eval: "[...document.querySelectorAll('[aria-label=人工工程流转] button')].find((button) => button.textContent === '转交后端')?.click(); true"
      - wait: '[aria-label="确认工程流转"]'
      - eval: "[...document.querySelectorAll('[aria-label=确认工程流转] button')].find((button) => button.textContent === '确认转交')?.click(); true"
      - wait: 1200
    assert:
      - text: { sel: '[role="dialog"]', contains: 已关闭（转交） }
      - text: { sel: '[aria-label="关联缺陷"]', contains: 浏览器后端工程 }
      - visible: 'article[data-stage="REPAIRING"] button[aria-label^="定位数据缺失缺陷，后端，"]'
      - hidden: 'article.collab-bug-card button[aria-label^="定位数据缺失缺陷，前端，"]'

  - name: handoff evidence is available on the target and running tasks hide routing
    steps:
      - click: '[aria-label="关联缺陷"] button'
      - wait: 350
      - click: '[aria-label="关联缺陷"] summary'
    assert:
      - text:
          {
            sel: '[aria-label="关联缺陷"] details[open]',
            contains: 核查边界数据并验证标签渲染,
          }
      - hidden: '[aria-label="人工工程流转"]'

  - name: manual collaboration keeps the original and disables further routing on both
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - click: 'button[aria-label^="待增加协作缺陷，前端，"]'
      - wait: '[role="dialog"]'
      - eval: "[...document.querySelectorAll('[aria-label=人工工程流转] button')].find((button) => button.textContent === '增加后端协作')?.click(); true"
      - wait: '[aria-label="确认工程流转"]'
      - eval: "[...document.querySelectorAll('[aria-label=确认工程流转] button')].find((button) => button.textContent === '确认增加协作')?.click(); true"
      - wait: 1200
    assert:
      - count:
          {
            sel: 'article[data-stage="REPAIRING"] button[aria-label^="待增加协作缺陷，"]',
            eq: 2,
          }
      - text: { sel: '[role="dialog"]', contains: 自动修复未完成 }
      - text:
          {
            sel: '[aria-label="关联缺陷"]',
            contains: 前后端关联单分别处理与验收,
          }
      - hidden: '[aria-label="人工工程流转"]'

  - name: joint registration remains reachable with keyboard focus in night theme
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('退出登录'))?.click(); true"
      - wait: 'input[name="username"]'
      - fill: { sel: 'input[name="username"]', text: __USERNAME__ }
      - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
      - click: '.auth-submit'
      - wait: { load: networkidle }
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - click: 'button[aria-label="切换暗夜主题"]'
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - click: '#collab-bug-form input[type="checkbox"]'
      - press: Tab
    assert:
      - visible: '.collab-shell[data-theme="night"]'
      - visible: 'select[aria-label="前端工程"]'
      - visible: 'select[aria-label="后端工程"]'
      - eval: "document.activeElement === document.querySelector('select[aria-label=前端工程]')"
      - visible: 'button[form="collab-bug-form"]'

  - name: existing completed repair validations remain visible to the tester
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - click: 'button[aria-label="切换纸张主题"]'
      - click: 'button[aria-label^="待验证返修缺陷，"]'
      - wait: '[role="dialog"]'
    assert:
      - text: { sel: '[role="dialog"]', contains: 夹具验证 }
      - text: { sel: '[role="dialog"]', contains: 通过 }
      - hidden: '[role="dialog"] .collab-repair-timeline code'

  - name: tester sees all seeded workflow states
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
    assert:
      - url: { contains: /cooking/__SUBMISSION_ID__ }
      - text: { sel: body, contains: 浏览器架构验收提测 }
      - visible: 'article[data-stage="WAITING_FOR_REPAIR"]'
      - visible: 'article[data-stage="WAITING_FOR_VERIFICATION"]'
      - visible: 'article[data-stage="DONE"]'
      - visible: 'article[data-visual-state="NEEDS_APPROVAL"]'

  - name: invalid project deep link normalizes to nearest accessible parent
    steps:
      - open: __BASE_URL__/cooking/projects?project=__PROJECT_ID__&panel=engineering&engineering=missing&mode=members
      - wait: { load: networkidle }
    assert:
      - url:
          {
            equals: __BASE_URL__/cooking/projects?project=__PROJECT_ID__&panel=engineering,
          }

  - name: attachment picker exposes unsupported-file feedback
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - eval: >-
          (() => { const input = document.querySelector('[aria-label="实际结果附件"] input[type="file"]');
          const transfer = new DataTransfer(); transfer.items.add(new File(['pdf'], 'unsupported.pdf', { type: 'application/pdf' }));
          Object.defineProperty(input, 'files', { configurable: true, value: transfer.files });
          input.dispatchEvent(new Event('change', { bubbles: true })); return true; })()
      - wait: 250
    assert:
      - text:
          {
            sel: '[aria-label="实际结果附件"] [role="status"]',
            contains: 仅支持 PNG、JPG、WEBP、TXT 和 JSON 文件,
          }

  - name: bug registration keeps attachments and reports the five-file boundary
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: "[...document.querySelectorAll('button')].find((button) => button.textContent?.includes('登记缺陷'))?.click(); true"
      - wait: '#collab-bug-form'
      - fill:
          {
            sel: '#collab-bug-form input[maxlength="240"]',
            text: 浏览器登记缺陷,
          }
      - fill:
          {
            sel: '#collab-bug-form .collab-bug-result-field:nth-of-type(1) textarea',
            text: 应显示成功反馈,
          }
      - fill:
          {
            sel: '#collab-bug-form .collab-bug-result-field:nth-of-type(2) textarea',
            text: 当前没有反馈,
          }
      - eval: >-
          (() => { const input = document.querySelector('[aria-label="实际结果附件"] input[type="file"]');
          const transfer = new DataTransfer(); for (let index = 1; index <= 6; index += 1)
          transfer.items.add(new File([`proof-${index}`], `browser-proof-${index}.txt`, { type: 'text/plain' }));
          Object.defineProperty(input, 'files', { configurable: true, value: transfer.files });
          input.dispatchEvent(new Event('change', { bubbles: true })); return true; })()
      - wait: 250
      - click: 'button[form="collab-bug-form"]'
      - wait: 1200
      - eval: "[...document.querySelectorAll('button.collab-bug-card__open')].find((button) => button.getAttribute('aria-label')?.startsWith('浏览器登记缺陷，'))?.click(); true"
      - wait: '[role="dialog"]'
    assert:
      - text: { sel: '[role="dialog"]', contains: browser-proof-1.txt }
      - count:
          { sel: '[role="dialog"] .collab-bug-detail-attachments li', eq: 5 }
      - hidden: '[role="dialog"] [title="browser-proof-6.txt"]'

  - name: drag cancel and undo restore the bug
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: >-
          (() => { const source = [...document.querySelectorAll('article.collab-bug-card')]
          .find((card) => card.textContent?.includes('待取消缺陷')); const target = document.querySelector('button[title="已取消缺陷"]');
          const transfer = new DataTransfer(); source.dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: transfer }));
          target.dispatchEvent(new DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: transfer }));
          target.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: transfer })); return true; })()
      - wait: 900
      - eval: "[...document.querySelectorAll('[role=status] button')].find((button) => button.textContent?.includes('撤销'))?.click(); true"
      - wait: 900
    assert:
      - visible: 'article[data-stage="WAITING_FOR_REPAIR"] button[aria-label^="待取消缺陷，"]'
      - text: { sel: '[role="status"]', contains: 已恢复到待修复 }

  - name: drag request repair moves the bug into engineering execution
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: >-
          (() => { const source = [...document.querySelectorAll('article.collab-bug-card')]
          .find((card) => card.textContent?.includes('待请求修复缺陷')); const target = [...document.querySelectorAll('section.collab-column')]
          .find((column) => column.querySelector('h2')?.textContent === '修复中'); const transfer = new DataTransfer();
          source.dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: transfer }));
          target.dispatchEvent(new DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: transfer }));
          target.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: transfer })); return true; })()
      - wait: 1000
    assert:
      - visible: 'article[data-stage="REPAIRING"] button[aria-label^="待请求修复缺陷，"]'

  - name: drag archive and undo unarchive the completed bug
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: >-
          (() => { const source = [...document.querySelectorAll('article.collab-bug-card')]
          .find((card) => card.textContent?.includes('待归档与重开缺陷')); const target = document.querySelector('button[title="归档缺陷"]');
          const transfer = new DataTransfer(); source.dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: transfer }));
          target.dispatchEvent(new DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: transfer }));
          target.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: transfer })); return true; })()
      - wait: 900
      - eval: "[...document.querySelectorAll('[role=status] button')].find((button) => button.textContent?.includes('撤销'))?.click(); true"
      - wait: 900
    assert:
      - visible: 'article[data-stage="DONE"] button[aria-label^="待归档与重开缺陷，"]'
      - text: { sel: '[role="status"]', contains: 已移出归档 }

  - name: verification failure creates a continuation repair
    steps:
      - open: __BASE_URL__/cooking/__SUBMISSION_ID__
      - wait: { load: networkidle }
      - eval: "[...document.querySelectorAll('article.collab-bug-card')].find((card) => card.textContent?.includes('待验证返修缺陷'))?.querySelector('button:not(.collab-bug-card__open)')?.click(); true"
      - wait: 'form[aria-label="不通过并返修"]'
      - fill:
          {
            sel: 'form[aria-label="不通过并返修"] textarea',
            text: 浏览器复测仍可复现,
          }
      - eval: '[...document.querySelectorAll(''form[aria-label="不通过并返修"] button'')].find((button) => button.textContent?.includes(''确认返修''))?.click(); true'
      - wait: 1200
    assert:
      - visible: 'article[data-stage="REPAIRING"] button[aria-label^="待验证返修缺陷，"]'

  - name: rework dialog starts focused with submit disabled
    steps:
