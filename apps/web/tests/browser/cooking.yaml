  - name: register and repair preserves the draft on error and queues on retry
    steps:
      - fill:
          {
            sel: '#collab-bug-form input[maxlength="240"]',
            text: 一键登记修复回归,
          }
      - eval: >-
          (() => { const button = document.querySelector('button[value=repair]'); button.focus();
          window.repairButtonFocused = document.activeElement === button;
          const original = window.fetch;
          window.fetch = (...args) => {
            if (new Headers(args[1]?.headers).has('Next-Action')) {
              window.fetch = original;
              return new Promise((resolve, reject) => setTimeout(() => reject(new TypeError('Failed to fetch')), 600));
            }
            return original(...args);
          }; return true; })()
      - click: 'button[value="repair"]'
      - wait: 900
    assert:
      - eval: 'window.repairButtonFocused'
      - visible: '#collab-bug-form'
      - visible: '#collab-bug-form [role="alert"]'
      - eval: 'document.querySelector("#collab-bug-form input[maxlength]").value === "一键登记修复回归"'

