          window.deleteControlBounds=()=>JSON.stringify([button,button.closest('article')].map(element=>element.getBoundingClientRect().toJSON()));
          window.deleteOriginalBounds=window.deleteControlBounds();
          window.deleteDefaultStyles=getComputedStyle(button).backgroundColor==='rgba(0, 0, 0, 0)';return true;})()
      - click: 'article:has(button[aria-label^="测试负责人删除缺陷，"]) .collab-bug-card__delete > button'
