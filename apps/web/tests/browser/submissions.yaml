  - name: deletion has reachable confirmation and disables pending actions
    steps:
      - click: 'article:has(button[aria-label^="测试负责人删除缺陷，"]) .collab-bug-card__delete > button'
      - eval: >-
          (() => { const group=document.querySelector('.collab-bug-card__delete .popconfirm:popover-open');
          const box=group.getBoundingClientRect(); window.deleteFits=box.top>=0 && box.bottom<=innerHeight && box.right<=innerWidth;
          window.deleteOriginalFetch=window.fetch;
          window.fetch=(...args)=>new Headers(args[1]?.headers).has('Next-Action')
          ? new Promise((resolve,reject)=>{window.rejectDelete=reject;}) : window.deleteOriginalFetch(...args); return true; })()
      - click: '.collab-bug-card__delete .popconfirm:popover-open button:last-child'
      - wait: '.collab-bug-card__delete .popconfirm:popover-open button:disabled'
    assert:
      - eval: 'window.deleteFits'
      - eval: 'window.deleteControlBounds() === window.deleteOriginalBounds'
      - eval: '[...document.querySelectorAll(".collab-bug-card__delete button")].every(button=>button.disabled)'
