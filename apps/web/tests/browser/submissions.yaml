  - name: vertical board scrolls to the final status with keyboard
    steps:
      - open: __BASE_URL__/submissions/__SUBMISSION_ID__
      - wait: '.collab-board > .collab-column'
      - eval: 'document.querySelector(".collab-board").focus(); true'
      - press: End
      - eval: >-
          (async () => {
            const board = document.querySelector('.collab-board');
            const deadline = performance.now() + 2000;
            while (board.scrollTop + board.clientHeight < board.scrollHeight - 1
              && performance.now() < deadline)
              await new Promise(requestAnimationFrame);
            const last = board.lastElementChild.getBoundingClientRect();
            sessionStorage.setItem('boardEndReachable', String(
              board.scrollTop > 0 && last.bottom <= board.getBoundingClientRect().bottom + 1));
            return true;
          })()
      - eval: 'document.querySelector(".collab-board").focus(); true'
      - press: Home
      - eval: >-
          (async () => {
            const board = document.querySelector('.collab-board');
            const deadline = performance.now() + 2000;
            while (board.scrollTop > 0 && performance.now() < deadline)
              await new Promise(requestAnimationFrame);
            board.style.width = 'min(100%, 560px)';
            return true;
          })()
    assert:
      - eval: 'sessionStorage.getItem("boardEndReachable") === "true"'
      - eval: >-
          (() => {
            const board = document.querySelector('.collab-board');
            const sections = [...board.children].map(section => section.getBoundingClientRect());
            return board.scrollTop === 0 && board.scrollWidth <= board.clientWidth + 1
              && sections.every((box, index) => index === 0 || box.top > sections[index - 1].bottom);
          })()

