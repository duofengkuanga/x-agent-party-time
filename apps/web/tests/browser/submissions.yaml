      - click: '.auth-submit'
      - wait: '.collab-bug-card'
      - click: '.collab-check input'
      - eval: 'document.documentElement.dataset.closedFilterReload="true";location.reload();true'
      - wait: 'html:not([data-closed-filter-reload]) .collab-bug-card'
      - wait: { load: networkidle }
      - eval: >-
          (()=>{if(!document.querySelector('.collab-check input').checked)throw new Error('Closed filter was lost after refresh');return true;})()
      - click: '.collab-check input'
      - click: 'button[aria-label="查看最后一张待关闭提测单详情"]'
      - wait: '.collab-rail__detail-footer button:not(:disabled)'
      - click: '.collab-rail__detail-footer button'
      - wait: '.collab-empty-stage'
      - wait: '.collab-check input:not(:disabled)'
      - eval: >-
          sessionStorage.setItem('lastSubmissionCleared',String(!document.querySelector('.collab-board,.collab-bug-card')&&document.querySelectorAll('.collab-submission-card').length===0));true
      - click: '.collab-check input'
      - wait: '.collab-submission-card__select'
      - click: '.collab-submission-card__select'
      - wait: '.collab-bug-card'
      - wait: { load: networkidle }
      - eval: >-
          sessionStorage.setItem('closedSelectionKeepsFilter',String(document.querySelector('.collab-check input').checked
          &&document.querySelectorAll('.collab-submission-card').length===1));true
      - click: '.collab-check input'
      - wait: '.collab-empty-stage'
      - wait: '.collab-check input:not(:disabled)'
    assert:
      - hidden: '.collab-bug-card'
      - hidden: '.collab-board'
      - count: { sel: '.collab-submission-card', eq: 0 }
      - eval: 'location.pathname==="/submissions"'
      - eval: >-
          ['lastSubmissionCleared','closedSelectionKeepsFilter'].every(key=>sessionStorage.getItem(key)==='true')
