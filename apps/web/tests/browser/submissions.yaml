  - name: environment deletion uses a button and anchored confirmation
    steps:
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: { load: networkidle }
      - click: '.project-settings__primary-action'
      - wait: '#project-create-form'
      - fill:
          { sel: '#project-create-form input[name="name"]', text: 环境删除验收 }
      - click: '#project-create-form button[type="submit"]'
      - wait: '.project-overview__empty'
      - click: '.project-engineering-create-trigger'
      - wait: '.engineering-editor input[name="name"]'
      - fill:
          { sel: '.engineering-editor input[name="name"]', text: 环境删除工程 }
      - fill:
          {
            sel: '.engineering-editor input[name="identifier"]',
            text: environment-delete,
          }
      - eval: >-
          (()=>{const select=document.querySelector('.engineering-editor select[name=type]');
          select.value='FRONTEND';select.dispatchEvent(new Event('change',{bubbles:true}));return true;})()
      - fill:
          {
            sel: '.engineering-join-environments input[name^="environmentIdentifier:"]',
            text: test,
          }
      - click: '.engineering-editor > .dialog-actions button[type="submit"]'
      - wait: 'body:not(:has(.engineering-create-modal[open]))'
      - click: '.environment-edit'
      - wait: '.environment-direct-row'
      - wait: 'body:not(:has(.notice-success)) .environment-direct-delete > button'
      - click: '.environment-direct-delete > button'
      - wait: '.popconfirm:popover-open'
      - eval: >-
          sessionStorage.setItem('environmentCancelInitiallyFocused',String(document.activeElement===document.querySelector('.popconfirm:popover-open button[type=button]')));true
      - click: '.popconfirm:popover-open button[type="button"]'
      - eval: >-
          sessionStorage.setItem('environmentCancelFocusReturned',String(!document.querySelector(':popover-open')&&document.activeElement===document.querySelector('.environment-direct-delete > button')));true
      - click: '.environment-direct-delete > button'
      - press: Escape
      - wait: 'body:not(:has(.popconfirm:popover-open))'
      - click: '.environment-direct-delete > button'
      - click: '.project-overview__heading'
      - wait: 'body:not(:has(.popconfirm:popover-open))'
      - click: '.environment-direct-delete > button'
      - wait: '.popconfirm:popover-open'
      - eval: >-
          (async()=>{const popup=document.querySelector('.popconfirm:popover-open');
          const confirm=popup.querySelector('button[type=submit]');confirm.focus();
          popup.dispatchEvent(new ToggleEvent('toggle',{oldState:'open',newState:'closed'}));
          await new Promise(resolve=>setTimeout(resolve,0));
          if(!popup.matches(':popover-open')||document.activeElement!==confirm)throw new Error('A stale toggle changed the current confirmation or focus');return true;})()
      - eval: >-
          (()=>{const box=document.querySelector('.popconfirm:popover-open').getBoundingClientRect();
          const trigger=document.querySelector('.environment-direct-delete > button').getBoundingClientRect();
          sessionStorage.setItem('environmentPopoverGeometry',JSON.stringify({popup:box.toJSON(),trigger:trigger.toJSON(),top:document.querySelector('.popconfirm:popover-open').style.top,ready:document.readyState}));
          sessionStorage.setItem('environmentPopoverAnchored',String(Math.abs(box.right-trigger.right)<1&&(Math.abs(trigger.top-box.bottom-8)<1||Math.abs(box.top-trigger.bottom-8)<1)&&box.top>=0&&box.right<=innerWidth));return true;})()
      - click: '.popconfirm:popover-open button[type="button"]'
      - eval: >-
          window.deleteEnvironmentFetch=window.fetch;window.fetch=(...args)=>new Headers(args[1]?.headers).has('Next-Action')
          ?new Promise((resolve,reject)=>{window.releaseEnvironmentDelete=()=>window.deleteEnvironmentFetch(...args).then(resolve,reject);})
          :window.deleteEnvironmentFetch(...args);true
      - click: '.environment-direct-delete > button'
      - click: '.popconfirm:popover-open button[type="submit"]'
      - wait: '.popconfirm[aria-busy="true"]'
      - eval: >-
          sessionStorage.setItem('environmentDeletePendingDisabled',String([...document.querySelectorAll('.environment-direct-delete button')].every(button=>button.disabled)));
          window.fetch=window.deleteEnvironmentFetch;window.releaseEnvironmentDelete();true
      - wait: 'body:not(:has(.environment-direct-row)) .environment-add'
      - eval: 'document.documentElement.dataset.environmentReloading="true";location.reload();true'
      - wait: 'html:not([data-environment-reloading]) .environment-add'
    assert:
      - hidden: '.environment-direct-row'
      - hidden: '.popconfirm:popover-open'
      - eval: >-
          (()=>{const flags=Object.fromEntries(['environmentCancelInitiallyFocused','environmentCancelFocusReturned','environmentPopoverAnchored','environmentDeletePendingDisabled'].map(key=>[key,sessionStorage.getItem(key)]));if(Object.values(flags).some(value=>value!=='true'))throw new Error(JSON.stringify({flags,geometry:sessionStorage.getItem('environmentPopoverGeometry')}));return true;})()

