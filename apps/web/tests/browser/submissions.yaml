          &&peers.filter(peer=>peer.querySelector('.collab-bug-card__actions')).every(peer=>Math.abs(peer.querySelector('.collab-bug-card__actions').getBoundingClientRect().bottom-card.querySelector('.collab-bug-card__actions').getBoundingClientRect().bottom)<1)
          &&footer.bottom <= bounds.bottom - 1 && card.scrollHeight <= card.clientHeight + 1 &&
          buttons.map(button=>button.textContent.trim()).join('|') === '重新打开|归档' &&
          buttons.every(button=>{const r=button.getBoundingClientRect(); return r.bottom<=bounds.bottom-1 && r.left>=bounds.left && r.right<=bounds.right;}); };
