suite: Module architecture browser acceptance
setup:
  - open: __BASE_URL__/login?next=/submissions/__SUBMISSION_ID__
  - eval: >-
      (()=>{const shell=document.querySelector('.auth-shell');
      if(!shell||getComputedStyle(shell).colorScheme!=='light'||document.querySelector('button[aria-label*=主题]'))
      throw new Error('登录页应固定使用浅色主题且没有主题切换入口');return true;})()
  - fill: { sel: 'input[name="username"]', text: __USERNAME__ }
  - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
  - click: '.auth-submit'
  - wait: { load: networkidle }
cases:
  - name: submission composer defaults to immutable PersonAgent mode
    steps:
      - open: __BASE_URL__/submissions/__SUBMISSION_ID__
      - wait: '.collab-rail__create'
      - click: '.collab-rail__create'
      - wait: '#submission-composer-title'
    assert:
      - text: { sel: '[aria-label="协作模式"]', contains: PersonAgent }
      - text:
          {
            sel: '[role="dialog"]:is(:not([popover]),:popover-open)[aria-labelledby="submission-composer-title"]',
            contains: 提测创建后，协作模式固定,
          }
      - hidden: '.collab-create-item [aria-label="Agent"]'

  - name: projects share the main shell
    steps:
      - open: __BASE_URL__/projects
      - wait: '.collab-topbar'
    assert:
      - hidden: 'button[aria-label*="主题"]'
      - eval: 'getComputedStyle(document.querySelector(".collab-shell")).colorScheme === "light"'
      - url: { contains: /projects }
      - count: { sel: '.collab-topbar', eq: 1 }
      - visible: '.collab-shell'
      - text: { sel: h1, contains: 我的项目 }

  - name: agents share the main shell
    steps:
      - open: __BASE_URL__/agents
      - wait: '.collab-topbar'
    assert:
      - hidden: 'button[aria-label*="主题"]'
      - eval: 'getComputedStyle(document.querySelector(".collab-shell")).colorScheme === "light"'
      - url: { contains: /agents }
      - count: { sel: '.collab-topbar', eq: 1 }
      - visible: '.collab-shell'
      - text: { sel: h1, contains: 我的 Agent }

  - name: submissions share the main shell
    steps:
      - open: __BASE_URL__/submissions
      - wait: '.collab-topbar'
    assert:
      - hidden: 'button[aria-label*="主题"]'
      - eval: 'getComputedStyle(document.querySelector(".collab-shell")).colorScheme === "light"'
      - url: { contains: /submissions }
      - count: { sel: '.collab-topbar', eq: 1 }
      - visible: '.collab-shell'
      - visible: '.collab-board'

  - name: project deletion uses a popconfirm and consumes its success message
    steps:
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: { load: networkidle }
      - click: '.project-settings__primary-action'
      - wait: '#project-create-form'
      - fill:
          {
            sel: '#project-create-form input[name="name"]',
            text: 删除项目浏览器验收,
          }
      - click: '#project-create-form button[type="submit"]'
      - wait: '.project-overview__empty'
      - eval: 'sessionStorage.setItem("projectDeleteAtTop",String(!!document.querySelector(".project-overview__heading .project-delete-control")));true'
      - click: '.project-delete-control > button'
      - wait: '.project-delete-control .popconfirm:popover-open'
      - eval: 'sessionStorage.setItem("projectDeleteSimpleConfirmation",String(!document.querySelector("input[name=confirmationName]:not([type=hidden])")&&document.activeElement.textContent==="取消"));true'
      - click: '.project-delete-control .popconfirm:popover-open button[type="button"]'
      - eval: 'sessionStorage.setItem("projectDeleteCancelFocus",String(document.activeElement===document.querySelector(".project-delete-control > button")));true'
      - eval: >-
          window.projectDeleteFetch=window.fetch;window.fetch=(...args)=>new Headers(args[1]?.headers).has('Next-Action')
          ?new Promise((resolve,reject)=>{window.releaseProjectDelete=()=>window.projectDeleteFetch(...args).then(resolve,reject);})
          :window.projectDeleteFetch(...args);true
      - click: '.project-delete-control > button'
      - click: '.project-delete-control .popconfirm:popover-open button[type="submit"]'
      - wait: '.project-delete-control .popconfirm[aria-busy="true"]'
      - eval: >-
          sessionStorage.setItem('projectDeletePendingDisabled',String([...document.querySelectorAll('.project-delete-control button')].every(button=>button.disabled)));
          window.fetch=window.projectDeleteFetch;window.releaseProjectDelete();true
      - eval: >-
          (async()=>{const deadline=performance.now()+10000;
          while(!document.querySelector('.notice-success')?.textContent.includes('项目已删除')){
          if(performance.now()>deadline)throw new Error('Project deletion success was not shown');
          await new Promise(resolve=>setTimeout(resolve,25));}return true;})()
      - eval: 'sessionStorage.setItem("deleteSuccessShown",String(document.querySelector(".notice-success").textContent.includes("项目已删除")));true'
      - wait: { load: networkidle }
      - wait: 'body:not(:has(.notice-success))'
      - eval: 'sessionStorage.setItem("deleteSuccessConsumed",String(!new URL(location.href).searchParams.has("success")));document.documentElement.dataset.feedbackReloading="true";location.reload();true'
      - wait: 'html:not([data-feedback-reloading]) .project-settings__content'
    assert:
      - eval: >-
          (()=>{if(document.querySelector('.notice-success'))throw new Error(JSON.stringify({url:location.href,message:document.querySelector('.notice-success').textContent,consumed:sessionStorage.getItem('deleteSuccessConsumed')}));return true;})()
      - hidden: '.popconfirm:popover-open'
      - eval: >-
          (()=>{const flags=Object.fromEntries(['projectDeleteAtTop','projectDeleteSimpleConfirmation','projectDeleteCancelFocus','projectDeletePendingDisabled','deleteSuccessShown','deleteSuccessConsumed'].map(key=>[key,sessionStorage.getItem(key)]));if(Object.values(flags).some(value=>value!=='true'))throw new Error(JSON.stringify(flags));return true;})()

  - name: active projects hide deletion from their owner
    steps:
      - eval: "[...document.querySelectorAll('button')].find(button=>button.textContent?.includes('退出登录'))?.click(); true"
      - wait: 'input[name="username"]'
      - open: __BASE_URL__/login?next=/projects
      - wait: 'input[name="username"]'
      - wait: { load: networkidle }
      - fill: { sel: 'input[name="username"]', text: browser-owner }
      - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
      - click: '.auth-submit'
      - wait: { load: networkidle }
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: '.project-name-direct'
      - eval: 'sessionStorage.setItem("activeProjectDeletionHidden",String(!document.querySelector(".project-delete-control")));true'
      - eval: >-
          (()=>{const selectors=['.project-engineering-create-trigger','.project-members-toggle','.project-overview__heading nav > a[href="/submissions"]'];
          const boxes=selectors.map(selector=>document.querySelector(selector).getBoundingClientRect());
          sessionStorage.setItem('projectActionsAligned',String(boxes.every(box=>box.width===104&&box.height===36)
          &&selectors.every(selector=>{const css=getComputedStyle(document.querySelector(selector));return css.fontSize==='12px'&&css.fontWeight==='500';})
          &&boxes[0].right<boxes[1].left&&boxes[1].right<boxes[2].left));return true;})()
      - wait: { load: networkidle }
      - eval: 'performance.clearResourceTimings();true'
      - click: '.project-engineering-create-trigger'
      - wait: '.engineering-create-modal[open]'
      - eval: >-
          sessionStorage.setItem('engineeringModalImmediate',String(document.querySelector('.engineering-create-modal').matches(':modal')
          &&document.activeElement===document.querySelector('.engineering-editor input[name=name]')
          &&performance.getEntriesByType('resource').every(entry=>!entry.name.includes('_rsc='))));true
      - press: Escape
      - wait: 'body:not(:has(.engineering-create-modal[open]))'
      - eval: 'sessionStorage.setItem("engineeringModalFocusReturned",String(document.activeElement===document.querySelector(".project-engineering-create-trigger")));true'
      - eval: "[...document.querySelectorAll('button')].find(button=>button.textContent?.includes('退出登录'))?.click(); true"
      - wait: 'input[name="username"]'
      - open: __BASE_URL__/login?next=/projects
      - wait: 'input[name="username"]'
      - wait: { load: networkidle }
      - fill: { sel: 'input[name="username"]', text: __USERNAME__ }
      - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
      - click: '.auth-submit'
      - wait: { load: networkidle }
      - wait: '.project-settings__content'
    assert:
      - eval: >-
          ['activeProjectDeletionHidden','projectActionsAligned','engineeringModalImmediate','engineeringModalFocusReturned'].every(key=>sessionStorage.getItem(key)==='true')

  - name: engineering header groups members beside the identifier and omits deferred fields
    steps:
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: '.engineering-heading-members'
    assert:
      - hidden: '.engineering-binding-strip'
      - hidden: '.binding-delete-control'
      - hidden: '.engineering-context'
      - hidden: '.project-settings__project-copy small'
      - hidden: '.project-overview__heading > div > p'
      - text: { sel: '.engineering-heading-members', contains: 工程成员 }
      - eval: >-
          (()=>{const identifier=document.querySelector('.engineering-identity-summary > div:last-child');
          const members=document.querySelector('.engineering-heading-members');
          return members.getBoundingClientRect().left>identifier.getBoundingClientRect().right
          &&Math.abs(members.querySelector('.engineering-field-label').getBoundingClientRect().top-identifier.querySelector('.engineering-field-label').getBoundingClientRect().top)<1;})()

  - name: project selection shows its target immediately while the request is pending
    steps:
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: '.project-settings__primary-action'
      - wait: { load: networkidle }
      - click: '.project-settings__primary-action'
      - wait: '#project-create-form'
      - fill:
          { sel: '#project-create-form input[name="name"]', text: 项目加载验收 }
      - click: '#project-create-form button[type="submit"]'
      - wait: '.project-overview__empty'
      - eval: 'document.documentElement.dataset.testReloading="true";window.location.reload();true'
      - wait: 'html:not([data-test-reloading]) .project-overview__empty'
      - wait: { load: networkidle }
      - click: '.project-settings__primary-action'
      - wait: '#project-create-form'
      - click: '.project-settings__primary-action'
      - wait: 'body:not(:has(#project-create-form))'
      - eval: >-
          window.projectLoadFetch=window.fetch;window.projectLoadSeen=[];window.fetch=(...args)=>{const input=args[0],url=new URL(typeof input==='string'?input:input instanceof Request?input.url:String(input),location.href);window.projectLoadSeen.push({path:url.pathname,project:url.searchParams.get('project'),rsc:url.searchParams.has('_rsc')});
          return url.pathname==='/projects'&&url.searchParams.get('project')==='__PROJECT_ID__'
          ?new Promise((resolve,reject)=>{window.releaseProjectLoad=()=>window.projectLoadFetch(...args).then(resolve,reject);})
          :window.projectLoadFetch(...args);};true
      - click: '.project-settings__list a[href="/projects?project=__PROJECT_ID__"]'
      - eval: >-
          (()=>{sessionStorage.setItem('projectPendingFeedback',String(!!document.querySelector('.project-settings__content[aria-busy=true] .project-loading')
          &&document.querySelector('.project-settings__list [aria-current=page]')?.getAttribute('href')==='/projects?project=__PROJECT_ID__'));
          window.fetch=window.projectLoadFetch;if(!window.releaseProjectLoad)throw new Error('Project request was not held: '+JSON.stringify(window.projectLoadSeen));window.releaseProjectLoad();return true;})()
      - wait: '.project-engineering[aria-label="浏览器前端工程"]'
    assert:
      - eval: 'sessionStorage.getItem("projectPendingFeedback")==="true"'
      - hidden: '.project-loading'

  - name: project overview expands engineering in the list without dialogs
    steps:
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: '.project-overview__engineering-list'
      - click: '.project-overview__engineering-list > li:nth-child(2) .project-engineering-list__link'
      - wait: '.project-engineering[aria-label="浏览器后端工程"]'
    assert:
      - count: { sel: '.project-engineering-list__link', eq: 3 }
      - hidden: '[role="tablist"]'
      - count: { sel: '.project-engineering', eq: 1 }
      - count: { sel: '.project-settings__list [aria-current="page"]', eq: 1 }
      - hidden: '[role="dialog"]:is(:not([popover]),:popover-open)'
      - hidden: '.repair-overlay'
      - hidden: '.auto-save-form'
      - hidden: '.project-engineering a[href*="mode="]'
      - text: { sel: '.project-members-toggle', contains: 项目成员 }
      - text:
          {
            sel: '.project-engineering-list__link[aria-expanded="true"]',
            contains: 浏览器后端工程,
          }
      - text:
          {
            sel: '.project-engineering-list__link[aria-expanded="true"]',
            contains: '1 个环境',
          }
      - text: { sel: '.project-engineering', contains: 浏览器后端环境 }
      - hidden: '.project-engineering .engineering-binding-strip'
      - eval: >-
          (()=>{const expanded=document.querySelector('.project-engineering-list__link[aria-expanded=true]');
          return expanded.closest('li').contains(document.getElementById(expanded.getAttribute('aria-controls')))
          &&expanded.closest('li').contains(document.querySelector('.project-engineering'));})()
      - eval: >-
          (()=>{const sidebar=document.querySelector('.project-settings__sidebar'),content=document.querySelector('.project-settings__content');
          const a=sidebar.getBoundingClientRect(),b=content.getBoundingClientRect();
          return a.right<=b.left+1&&Math.abs(a.top-b.top)<1
          &&getComputedStyle(content).overflowY==='auto';})()

  - name: opening an engineering row does not refetch the project page
    steps:
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: '.project-overview__engineering-list'
      - wait: { load: networkidle }
      - eval: 'performance.clearResourceTimings();true'
      - click: '.project-overview__engineering-list > li:nth-child(2) .project-engineering-list__link'
      - wait: '.project-engineering[aria-label="浏览器后端工程"]'
    assert:
      - eval: 'performance.getEntriesByType("resource").every(entry=>!entry.name.includes("_rsc="))'
      - text:
          {
            sel: '.project-engineering-list__link[aria-expanded="true"]',
            contains: 浏览器后端工程,
          }

  - name: engineering expansion follows browser back and forward
    steps:
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: '.project-overview__engineering-list'
      - click: '.project-overview__engineering-list > li:nth-child(2) .project-engineering-list__link'
      - wait: '.project-engineering[aria-label="浏览器后端工程"]'
      - click: '.project-overview__engineering-list > li:nth-child(3) .project-engineering-list__link'
      - wait: '.project-engineering[aria-label="浏览器追加工程"]'
      - eval: 'window.history.back();true'
      - wait: '.project-engineering[aria-label="浏览器后端工程"]'
      - eval: 'window.history.forward();true'
      - wait: '.project-engineering[aria-label="浏览器追加工程"]'
    assert:
      - text:
          {
            sel: '.project-engineering-list__link[aria-expanded="true"]',
            contains: 浏览器追加工程,
          }
      - count: { sel: '.project-engineering', eq: 1 }

  - name: engineering rows can be opened and collapsed with the keyboard
    steps:
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: '.project-engineering-list__link[aria-expanded="true"]'
      - click: '.project-engineering-list__link[aria-expanded="true"]'
      - wait: '.project-overview__engineering-list:not(:has([aria-expanded=true]))'
      - press: Tab
      - eval: >-
          (()=>{const link=document.querySelector('.project-overview__engineering-list > li:nth-child(2) .project-engineering-list__link');
          return document.activeElement===link&&link.matches(':focus-visible')&&getComputedStyle(link).outlineStyle!=='none';})()
      - press: Enter
      - wait: '.project-engineering[aria-label="浏览器后端工程"]'
      - press: Enter
      - wait: '.project-overview__engineering-list:not(:has([aria-expanded=true]))'
      - eval: 'document.documentElement.dataset.engineeringReloading="true";location.reload();true'
      - wait: 'html:not([data-engineering-reloading]) .project-overview__engineering-list'
    assert:
      - count:
          {
            sel: '.project-engineering-list__link[aria-expanded="false"]',
            eq: 3,
          }
      - hidden: '.project-engineering'
      - hidden: '.repair-overlay'

  - name: project search keeps the selected information visible
    steps:
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: '.project-engineering'
      - fill: { sel: '.project-settings__search input', text: 不存在的项目 }
    assert:
      - visible: '.project-settings__search-empty'
      - count: { sel: '.project-settings__list li', eq: 0 }
      - count: { sel: '.project-engineering', eq: 1 }

  - name: engineering environment shows stable identity
    steps:
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: '.project-overview__engineering-list'
      - click: '.project-overview__engineering-list > li:nth-child(3) .project-engineering-list__link'
      - wait: '.project-engineering[aria-label="浏览器追加工程"]'
    assert:
      - text:
          {
            sel: '.project-engineering .environment-selector__key code',
            contains: '84',
          }
      - count: { sel: '.project-engineering input[name="command"]', eq: 0 }
      - hidden: '[role="dialog"]:is(:not([popover]),:popover-open)'

  - name: direct editing autosaves and waits for pending input before navigation
    steps:
      - open: __BASE_URL__/projects?project=__PROJECT_ID__
      - wait: '.project-settings__primary-action'
      - click: '.project-settings__primary-action'
      - fill:
          {
            sel: '#project-create-form input[name="name"]',
            text: 自动保存初始项目,
          }
      - click: '#project-create-form button[type="submit"]'
      - wait: '.project-overview__empty'
      - fill:
          { sel: '.project-name-direct input[name="name"]', text: 自动保存验收 }
      - wait: '.project-name-direct[data-save-state="saved"]'
      - click: '.project-engineering-create-trigger'
      - wait: '.engineering-editor input[name="name"]'
      - fill:
          { sel: '.engineering-editor input[name="name"]', text: 直接编辑工程 }
      - fill:
          {
            sel: '.engineering-editor input[name="identifier"]',
            text: autosave-web,
          }
      - eval: >-
          (()=>{const select=document.querySelector('.engineering-editor select[name=type]');
          select.value='FRONTEND';select.dispatchEvent(new Event('change',{bubbles:true}));return true;})()
      - fill:
          {
            sel: '.engineering-join-environments input[name^="environmentIdentifier:"]',
            text: test,
          }
      - click: '.engineering-editor > .dialog-actions button[type="submit"]'
      - wait: 'body:not(:has(.engineering-create-modal[open]))'
      - wait: '.engineering-identity-form'
      - click: '.engineering-type-choice label:has(input[value="BACKEND"])'
      - wait: '.engineering-identity-form[data-save-state="saved"]'
      - click: '.engineering-type-choice label:has(input[value="FRONTEND"])'
      - wait: '.engineering-identity-form[data-save-state="saved"]'
      - eval: >-
          sessionStorage.setItem('directControls',String(!document.querySelector('a[href*="mode="],a[href*="panel=project"],a[href*="panel=collaboration"],.auto-save-form button[type=submit],[role=dialog]:is(:not([popover]),:popover-open):not(.popconfirm),.repair-overlay')));true
      - click: '.environment-edit'
      - fill:
          { sel: '.environment-direct-row input[name="name"]', text: 集成环境 }
      - wait: '.environment-direct-row .auto-save-form[data-save-state="saved"]'
      - eval: 'document.documentElement.dataset.testReloading="true";window.location.reload();true'
      - wait: 'html:not([data-test-reloading]) .environment-selector'
      - click: '.environment-edit'
      - wait: { load: networkidle }
      - eval: >-
          document.querySelector('.environment-selector__key code').textContent === 'test'
      - click: '.environment-add'
      - fill:
          {
            sel: '.environment-direct-form--new input[name="name"]',
            text: 预发布环境,
          }
      - fill:
          {
            sel: '.environment-direct-form--new input[name="environmentIdentifier"]',
            text: staging,
          }
      - wait: '.environment-selector:has([role=option]:nth-child(2))'
      - wait: 'body:not(:has(.environment-direct-form--new))'
      - click: '.environment-selector [role=combobox]'
      - press: End
      - press: Enter
      - wait: '.environment-direct-row[aria-label="预发布环境"]'
      - fill: { sel: '.environment-direct-row input[name=name]', text: '' }
      - wait: '.environment-direct-form[data-save-state="error"]'
      - click: '.environment-selector [role=combobox]'
      - press: Home
      - press: Enter
      - eval: >-
          sessionStorage.setItem('environmentDraftPreserved',String(document.querySelector('.environment-selector [role=combobox]').textContent.includes('预发布环境')
          &&document.querySelector('.environment-direct-row input[name=name]').value===''));true
      - fill:
          { sel: '.environment-direct-row input[name=name]', text: 预发布环境 }
      - wait: '.environment-direct-form:not([data-save-state="error"])'
      - click: '.environment-selector [role=combobox]'
      - press: Home
      - press: Enter
      - wait: '.environment-direct-row[aria-label="集成环境"]'
      - click: '.environment-add'
      - wait: '.environment-direct-form--new'
      - eval: >-
          (()=>{const inputs=[...document.querySelectorAll('.environment-direct-form--new input:not([type=hidden])')].map(input=>input.getBoundingClientRect());
          sessionStorage.setItem('environmentFieldsAligned',String(inputs.length===2&&Math.abs(inputs[0].top-inputs[1].top)<1&&inputs[0].right<inputs[1].left));return true;})()
      - click: '.environment-direct-delete > button'
      - wait: '.popconfirm:popover-open'
      - eval: >-
          (()=>{const popup=document.querySelector('.environment-direct-delete :popover-open').getBoundingClientRect();
          sessionStorage.setItem('environmentConfirmationFits',String(popup.left>=0&&popup.right<=innerWidth&&popup.top>=0&&popup.bottom<=innerHeight));return true;})()
      - click: '.popconfirm:popover-open button[type="button"]'
      - fill:
          {
            sel: '.environment-direct-form--new input[name="name"]',
            text: 未完成的环境,
          }
      - fill:
          {
            sel: '.environment-direct-form--new input[name="environmentIdentifier"]',
            text: test,
          }
      - wait: '.environment-direct-form--new[data-save-state="error"]'
      - eval: >-
          (()=>{const form=document.querySelector('.environment-direct-form--new');
          const error=form.querySelector('[role=alert]').getBoundingClientRect();
          const cancel=form.querySelector('.environment-direct-form__hint button').getBoundingClientRect();
          sessionStorage.setItem('environmentErrorReadable',String(error.top>=cancel.bottom&&error.bottom<=form.getBoundingClientRect().bottom));return true;})()
      - click: '.environment-direct-form__hint button'
      - click: '.engineering-member-toggle input'
      - wait: '.engineering-member-toggle[aria-busy="false"] input:not(:checked)'
      - click: '.engineering-member-toggle input'
      - wait: '.engineering-member-toggle[aria-busy="false"] input:checked'
      - click: '.project-engineering-create-trigger'
      - wait: '.engineering-editor input[name="name"]'
      - fill:
          { sel: '.engineering-editor input[name="name"]', text: 切换目标工程 }
      - fill:
          {
            sel: '.engineering-editor input[name="identifier"]',
            text: autosave-api,
          }
      - eval: >-
          (()=>{const select=document.querySelector('.engineering-editor select[name=type]');
          select.value='BACKEND';select.dispatchEvent(new Event('change',{bubbles:true}));return true;})()
      - fill:
          {
            sel: '.engineering-join-environments input[name^="environmentIdentifier:"]',
            text: test,
          }
      - click: '.engineering-editor > .dialog-actions button[type="submit"]'
      - wait: 'body:not(:has(.engineering-create-modal[open]))'
      - wait: '.project-engineering[aria-label="切换目标工程"]'
      - click: 'text=直接编辑工程'
      - wait: '.project-engineering[aria-label="直接编辑工程"]'
      - eval: >-
