suite: Queued update presentation
setup:
  - open: __BASE_URL__/login?next=/submissions/__SUBMISSION_ID__
  - fill: { sel: 'input[name="username"]', text: __USERNAME__ }
  - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
  - click: '.auth-submit'
  - wait: 'button[aria-label^="批次更新缺陷甲，"]'
cases:
  - name: frozen update stays in waiting column without a collection countdown
    assert:
      - visible: 'article[data-stage="WAITING_FOR_UPDATE"] button[aria-label^="批次更新缺陷甲，"]'
      - visible: 'article[data-stage="WAITING_FOR_UPDATE"] button[aria-label^="批次更新缺陷乙，"]'
      - text:
          {
            sel: 'article:has(button[aria-label^="批次更新缺陷甲，"])',
            contains: '已排队，等待 Agent 启动',
          }
      - count:
          {
            sel: 'article:has(button[aria-label^="批次更新缺陷甲，"]) .collab-bug-card__countdown',
            eq: 0,
          }
      - eval: 'document.querySelector("button[aria-label^=\"批次更新缺陷甲，\"]").closest(".collab-column").querySelector("h2").textContent === "待更新"'

  - name: frozen update remains readable in night theme
    steps:
      - click: 'button[aria-label="切换暗夜主题"]'
      - wait: '.collab-shell[data-theme="night"]'
      - click: 'button[aria-label^="批次更新缺陷甲，"]'
      - wait: '[role="dialog"]'
    assert:
      - text: { sel: '[role="dialog"]', contains: '修复已完成' }
      - eval: 'document.querySelector("[role=dialog]").scrollWidth <= document.querySelector("[role=dialog]").clientWidth'

  - name: developer sees queued status and cannot freeze an already frozen defect
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - click: 'button[aria-label="切换纸张主题"]'
      - click: 'button[aria-label="打开账号菜单"]'
      - click: '.collab-account-menu__panel form button'
      - wait: 'input[name="username"]'
      - fill: { sel: 'input[name="username"]', text: __DEVELOPER_USERNAME__ }
      - fill: { sel: 'input[name="password"]', text: __PASSWORD__ }
      - click: '.auth-submit'
      - wait: '.collab-board'
      - open: __BASE_URL__/submissions/__SUBMISSION_ID__
      - wait: 'button[aria-label^="批次更新缺陷甲，"]'
      - click: 'button[aria-label^="批次更新缺陷甲，"]'
      - wait: '.collab-developer-detail'
    assert:
      - text:
          {
            sel: '.collab-developer-status',
            contains: '已排队，等待 Agent 启动',
          }
      - hidden: '[aria-label="待更新操作"]'
      - text: { sel: '[role="dialog"]', contains: '第 1 轮更新' }

  - name: developer queued status remains readable in night theme
    steps:
      - click: 'button[aria-label="关闭详情抽屉"]'
      - click: 'button[aria-label="切换暗夜主题"]'
      - wait: '.collab-shell[data-theme="night"]'
      - click: 'button[aria-label^="批次更新缺陷甲，"]'
      - wait: '.collab-developer-detail'
    assert:
      - text:
          {
            sel: '.collab-developer-status',
            contains: '已排队，等待 Agent 启动',
          }
      - hidden: '[aria-label="待更新操作"]'
      - eval: 'document.querySelector(".collab-bug-drawer").scrollWidth <= document.querySelector(".collab-bug-drawer").clientWidth'
